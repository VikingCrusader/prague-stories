    <script>
      // Apply the theme before first paint (see ThemeContext.jsx). Light is
      // the default for new visitors and guests; only a saved 'dark' (or an
      // account preference, applied after sign-in) gives the dark theme.
      var theme = 'light';
      try { if (localStorage.getItem('theme') === 'dark') theme = 'dark'; } catch (e) {}
      document.documentElement.setAttribute('data-theme', theme);
      if (theme === 'light') {
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#9e1b1b');
      }
    </script>

    <style>
      /* Boot splash: shown from the first paint until the sign-in check is
         done (hideBootSplash in utils/bootSplash.js), at most 8 s. Same look
         as the iOS launch images, so the hand-over is seamless. */
      #boot-splash { position: fixed; inset: 0; z-index: 2147483000; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 4vh;
        background: radial-gradient(circle at 50% 44%, #1d2348 0%, #111428 62%);
        transition: opacity 0.35s ease; }
      #boot-splash.is-hiding { opacity: 0; pointer-events: none; }
      #boot-splash .boot-splash__emblem { width: min(52vw, 40vh, 340px); }
      #boot-splash .boot-splash__wordmark { width: min(66vw, 46vh, 440px); }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <img class="boot-splash__emblem" src="/brand/splash-emblem.webp" alt="" />
      <img class="boot-splash__wordmark" src="/brand/splash-wordmark.webp" alt="" />
    </div>
    <script>
      window.hideBootSplash = function () {
        var el = document.getElementById('boot-splash');
        if (!el || el.classList.contains('is-hiding')) return;
        el.classList.add('is-hiding');
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 400);
      };
      setTimeout(window.hideBootSplash, 8000);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
